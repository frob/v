name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The only host prerequisites are Docker (preinstalled on the runner)
      # and Task. Every build/test/lint step runs inside the pinned tooling
      # container the Taskfile builds, so CI uses the exact same toolchain as
      # local development — see agent.md and the containerized-tooling rules.
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Mirror of `task check`: test + lint + integrated smoke test, all run
      # inside v-tooling:dev. To reproduce a CI failure locally, run the same
      # command: `task check`.
      - name: Quality gate
        run: task check
