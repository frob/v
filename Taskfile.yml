version: "3"

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -o dist/v .

  run:
    desc: Run the CLI
    cmds:
      - go run . {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t v .

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  vendor:
    desc: Vendor dependencies
    cmds:
      - go mod vendor
