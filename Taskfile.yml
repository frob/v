version: "3"

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -o dist/v .

  run:
    desc: Run the CLI
    cmds:
      - go run . {{.CLI_ARGS}}

  run:test-add:
    desc: Run the add command with -d test-v and https://github.com/frob/v
    cmds:
      - task run -- add -d test-v https://github.com/frob/v

  run:test-update:
    desc: Run the update command with https://github.com/frob/v
    cmds:
      - task run -- update https://github.com/frob/v 0.1.x

  test:
    desc: Run tests
    cmds:
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t v .

  get:
    desc: "Add a dependency (usage: task get -- <module@version>)"
    cmds:
      - go get {{.CLI_ARGS}}

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  vendor:
    desc: Vendor dependencies
    cmds:
      - go mod vendor

  release:check:
    desc: Validate goreleaser config
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build all platform binaries locally without publishing
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Cut a release and publish (requires GITHUB_TOKEN)
    cmds:
      - goreleaser release --clean
