version: 2

project_name: v

dist: dist

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: v
    ldflags:
      - -s -w
      - -X github.com/frob/v/cmd.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - package_name: v
    homepage: https://github.com/frob/v
    maintainer: frob
    description: v is a CLI tool
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/local/bin

brews:
  - name: v
    repository:
      owner: frob
      name: homebrew-v
    directory: Formula
    homepage: https://github.com/frob/v
    description: v is a CLI tool
    license: MIT
    install: bin.install "v"
